name: Android
on:
  push:
    tags: ["companion-v*"]
permissions:
  contents: write
jobs:
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-tags: true
      - run: python3 scripts/ci_guard.py
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Assemble release
        run: android/gradlew -p android assembleRelease --no-watch-fs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/relume-release.apk relume-companion.apk
          gh release create "$GITHUB_REF_NAME" relume-companion.apk \
            --title "Relume companion ${GITHUB_REF_NAME#companion-v}" \
            --notes "${{ github.sha }}"

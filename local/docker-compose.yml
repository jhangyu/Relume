# No `ports:` anywhere: all services share flaresolverr's network namespace,
# so the builder reaches both sidecars on localhost and nothing is published to the host.
name: rv-local
services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      PORT: "47191"
  cfbypass:
    build:
      # pinned upstream commit; its Dockerfile is multi-arch (ubuntu:rolling + CloakBrowser linux-arm64)
      context: https://github.com/sarperavci/CloudflareBypassForScraping.git#0f628b9ccbea9ab69ca61bc1c896c2ef766a0f06
    image: rv-local-cfbypass:0f628b9
    # upstream has CMD (no ENTRYPOINT); the entrypoint forwards args to server.py
    command: ["/app/docker-entrypoint.sh", "--port", "47800"]
    shm_size: 2g
    network_mode: service:flaresolverr
    depends_on: [flaresolverr]
  apkmsolver:
    # headed CloakBrowser Turnstile solver for APKMirror downloads; same image as cfbypass, own entrypoint starts Xvfb
    image: rv-local-cfbypass:0f628b9
    entrypoint: ["sh", "/repo/local/solver/xrun.sh"]
    command: ["/app/venv/bin/python3", "-u", "/repo/local/solver/solver.py", "47900"]
    shm_size: 2g
    network_mode: service:flaresolverr
    depends_on: [flaresolverr, cfbypass]
    volumes:
      - ..:/repo:ro
  builder:
    build:
      context: ..
      dockerfile: local/Dockerfile
    image: rv-local-builder
    network_mode: service:flaresolverr
    depends_on: [flaresolverr, cfbypass, apkmsolver]
    environment:
      FLARESOLVERR_PORT: "47191"
      CFBYPASS_PORT: "47800"
      APKM_SOLVER_PORT: "47900"
    volumes:
      - ..:/repo
      # token file is created by build.sh; create_host_path: false stops Docker from creating a directory there
      - type: bind
        source: ${RV_GITHUB_TOKEN_FILE:-../src/keystore/github_token}
        target: /run/secrets/github_token
        read_only: true
        bind:
          create_host_path: false
    working_dir: /repo

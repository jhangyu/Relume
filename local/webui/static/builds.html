<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Builds · Relume</title><link rel="stylesheet" href="/static/app.css"><link rel="manifest" href="/static/manifest.webmanifest"><meta name="theme-color" content="#ffffff"><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="icon" href="/static/icon-192.png" type="image/png" sizes="192x192"><link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
.live{display:grid;grid-template-columns:320px 1fr;overflow:hidden}
.queue{padding:16px;border-right:1px solid var(--colorNeutralStroke3);display:grid;gap:8px;align-content:start}
.job{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px;border-radius:var(--borderRadiusXLarge);border:1px solid var(--colorNeutralStroke2);color:inherit}
.job:hover{text-decoration:none;background:var(--colorNeutralBackground2)}
.job.on{border:2px solid var(--colorBrandBackground);padding:11px;background:var(--colorBrandBackground2)}
.job .tile{grid-row:span 3}
.log{margin:0;padding:16px 20px;height:340px;overflow:auto;border-radius:0;background:var(--colorNeutralBackground2);font:12px/20px var(--fontFamilyMonospace);color:var(--colorNeutralForeground2)}
.log div{white-space:pre-wrap;word-break:break-all}
.log div.ok{color:var(--colorStatusSuccessForeground1)}.log div.w{color:var(--colorStatusWarningForeground1)}.log div.e{color:var(--colorStatusDangerForeground1)}.log div.s{color:var(--colorBrandForeground2);font-weight:600}
.log .t{color:var(--colorNeutralForeground3);font-weight:400}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid var(--colorNeutralStroke2)}
.tw{overflow-x:auto}
.danger{color:var(--colorStatusDangerForeground1)}
.table tr[aria-current=true] td{background:var(--colorBrandBackground2)}
.table td:last-child .dd,.table td:last-child .icon-btn{vertical-align:middle}
.table td:last-child{white-space:nowrap}
.table td:last-child .dd{display:inline-block}
@media (max-width:900px){.live{grid-template-columns:1fr}.queue{border-right:0;border-bottom:1px solid var(--colorNeutralStroke3)}.log{height:240px}}
</style>
<script type="module" src="/static/builds.js"></script></head><body><a class="skip" href="#main">Skip to content</a>
<div class="shell"><aside class="side" aria-label="Primary"></aside>
<div class="main"><header class="header"><button class="icon-btn menu-btn" type="button" data-nav-toggle aria-label="Open navigation" title="Open navigation"><svg class="i" aria-hidden="true"><use href="#i-menu"/></svg></button><h1 class="subtitle1">Builds</h1><span class="badge brand" id="qsum"></span></header>
<main id="main" class="content">
<section class="card live" aria-label="Running and queued">
<div class="queue" id="queue"></div>
<div style="min-width:0;display:flex;flex-direction:column">
<div class="card-head"><span class="strong grow" id="bt">No build selected</span><span class="caption hide-m" id="bsub"></span>
<button class="icon-btn" type="button" id="dlog" aria-label="Download log" data-tip="Download log"><svg class="i" aria-hidden="true"><use href="#i-download"/></svg></button>
<button class="btn small" type="button" id="cancel" disabled><svg class="i i-16" aria-hidden="true"><use href="#i-close"/></svg>Cancel</button></div>
<div class="log" id="log" role="log" aria-live="polite" aria-label="Build log" tabindex="0"></div>
</div></section>
<section class="section" aria-labelledby="h-t">
<div class="section-head"><h2 class="subtitle1" id="h-t">History</h2><span class="caption" id="hsum"></span></div>
<div class="card">
<div class="filters"><label class="input search" style="width:240px"><svg class="i i-16" aria-hidden="true"><use href="#i-search"/></svg><span class="sr-only">Search builds</span><input type="search" id="hq" placeholder="Search app or bundle"></label>
<span class="row wrap" id="pills"><button class="pill" type="button" data-filt="" aria-pressed="true">All</button><button class="pill" type="button" data-filt="success" aria-pressed="false">Succeeded</button><button class="pill" type="button" data-filt="failed" aria-pressed="false">Failed</button><button class="pill" type="button" data-filt="cancelled" aria-pressed="false">Cancelled</button><button class="pill" type="button" data-filt="item" id="pill-item" aria-pressed="false">This app</button></span></div>
<div class="tw"><table class="table" id="hist"><thead><tr><th>App</th><th>Bundle</th><th>App version</th><th>Started</th><th>Duration</th><th>Result</th><th style="text-align:right">Actions</th></tr></thead><tbody></tbody></table></div>
<div class="dlg-actions" style="justify-content:center;margin:0;padding:12px"><button class="btn small" type="button" id="older">Load older</button></div>
</div></section></main></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg><span></span></div>
</body></html>

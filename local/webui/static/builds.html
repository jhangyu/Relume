<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Builds · Relume</title><link rel="stylesheet" href="/static/app.css"><link rel="manifest" href="/static/manifest.webmanifest"><meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff"><meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b"><link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
.facts{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;margin:.75rem 0 0}.facts dt{font-size:.6875rem}.facts dd{margin:0}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5rem;list-style:none;padding:0;margin:1rem 0 0}
.steps li{padding-top:.5rem;border-top:3px solid hsl(var(--muted));font-size:.75rem;font-weight:500;color:hsl(var(--muted-fg))}
.steps li small{display:block;font:400 .6875rem ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:hsl(var(--muted-fg))}
.steps li.done{border-top-color:hsl(var(--ok));color:hsl(var(--fg))}
.steps li.now{border-top-color:hsl(var(--info));color:hsl(var(--info))}
.steps li.fail{border-top-color:hsl(var(--destructive));color:hsl(var(--destructive))}
.log{counter-reset:ln}.log div{counter-increment:ln}
.log div::before{content:counter(ln);display:inline-block;min-width:2rem;margin-right:.75rem;text-align:right;color:#52525b;user-select:none}
.log.nowrap div{white-space:pre;word-break:normal}
.log div.hit{background:rgb(250 204 21/.2)}
@media (max-width:768px){.steps{grid-template-columns:minmax(0,1fr)}.steps li{display:flex;justify-content:space-between;gap:.5rem}#find{width:100%!important;flex:1 1 100%}}
.tbl tr[aria-current=true] td{background:hsl(var(--accent)/.06)}.tbl tr[aria-current=true] td:first-child{box-shadow:inset 3px 0 0 hsl(var(--accent))}
</style>
<script>document.documentElement.dataset.theme=localStorage.getItem('relume-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')</script>
<script type="module" src="/static/builds.js"></script></head><body><a class="skip" href="#main">Skip to content</a>
<div class="shell"><aside class="side" aria-label="Primary"></aside>
<div class="main"><header class="top"><div class="row" style="gap:.75rem;flex-wrap:nowrap;min-width:0">
<button class="btn btn-outline btn-icon only-m" type="button" data-nav-toggle aria-label="Open navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<div style="min-width:0"><div class="crumbs">Home</div><h1>Builds</h1></div></div>
<div class="row" style="flex-wrap:nowrap"><button class="btn btn-ghost btn-icon" type="button" data-theme-toggle aria-label="Toggle light/dark theme" title="Toggle light/dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></header>
<main id="main" class="content">
<section class="card" aria-labelledby="qh"><div class="card-h"><div class="row between"><h2 id="qh">Queue</h2><p class="xs muted" id="qsum"></p></div></div>
<div style="overflow:auto"><table class="tbl" id="queue"><tbody></tbody></table></div></section>
<section class="card" aria-labelledby="bt"><div class="card-h"><div class="row between"><div class="row" style="flex-wrap:nowrap;min-width:0"><span class="ico" id="bico" aria-hidden="true"></span><div style="min-width:0"><div class="row"><h2 id="bt">No build selected</h2><span class="src" id="bsrc"></span><span class="badge b-mute" id="bst"></span></div><p class="xs muted" id="bsub"></p></div></div>
<div class="row"><button class="btn btn-outline btn-sm danger" type="button" id="cancel" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>Cancel</button></div></div>
<dl class="facts xs" id="facts"></dl>
<ol class="steps" id="steps" aria-label="Build steps"><li data-s="version">Resolve version<small>—</small></li><li data-s="download">Download APK<small>—</small></li><li data-s="patch">Patch<small>—</small></li><li data-s="verify">Verify<small>—</small></li><li data-s="store">Store<small>—</small></li></ol>
<div class="progress" style="margin-top:.75rem" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Build progress"><i id="pbar" style="width:0%"></i></div></div>
<div class="card-c stack-sm"><div class="row between logbar"><div class="row"><label class="row sm" style="flex-wrap:nowrap"><span class="switch"><input type="checkbox" id="follow" checked><span></span></span>Follow</label><label class="row sm" style="flex-wrap:nowrap"><span class="switch"><input type="checkbox" id="wrap" checked><span></span></span>Wrap</label><input class="input" id="find" type="search" placeholder="Find in log…" aria-label="Find in log" style="width:12rem;height:2rem"><span class="xs muted" id="hits"></span></div>
<div class="row"><span class="xs muted" id="lines"></span><button class="btn btn-outline btn-sm" type="button" id="copy">Copy</button><button class="btn btn-outline btn-sm" type="button" id="dlog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>.log</button></div></div>
<div class="log mono" id="log" role="log" aria-live="polite" aria-label="Build output" tabindex="0"></div></div></section>
<section class="card"><div class="card-h"><div class="row between"><h2>History</h2><select class="input" id="filt" style="width:auto" aria-label="Filter history"><option value="">All results</option><option value="failed">Failed</option><option value="success">Success</option><option value="item">This app</option></select></div></div>
<div style="overflow:auto"><table class="tbl" id="hist"><thead><tr><th>#</th><th>Item</th><th class="hide-m">Trigger</th><th>Result / failure reason</th><th class="hide-m">Started</th><th class="hide-m">Duration</th><th class="hide-m">Artifact</th><th></th></tr></thead><tbody></tbody></table></div>
<div class="card-f" style="justify-content:center"><button class="btn btn-outline btn-sm" type="button" id="older">Load older</button></div></section></main></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg><span></span></div>
</body></html>

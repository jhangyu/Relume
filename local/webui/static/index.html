<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketplace · Relume</title><link rel="stylesheet" href="/static/app.css"><link rel="manifest" href="/static/manifest.webmanifest"><meta name="theme-color" content="#ffffff"><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="icon" href="/static/icon-192.png" type="image/png" sizes="192x192"><link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
.hero { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 4px; }
.hero .feature { flex: 0 0 calc((100% - 32px) / 3.5); scroll-snap-align: start; }
.hero .feature:first-child { flex-basis: calc((100% - 32px) / 3.5 * 1.4); }
.hero > *, .gallery > *, .detail > * { min-width: 0; }
.mono { overflow-wrap: anywhere; }
.feature { position: relative; overflow: hidden; border-radius: var(--borderRadius3XLarge); padding: 24px; min-height: 196px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: var(--shadow8); cursor: pointer; border: 0; text-align: left; transition: transform var(--durationNormal) var(--curveDecelerateMid), box-shadow var(--durationNormal); }
.feature:hover { transform: translateY(-2px); box-shadow: var(--shadow28); }
.feature::before { content: ""; position: absolute; width: 320px; height: 320px; right: -90px; top: -120px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.28), transparent 65%); }
.feature .kicker { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .92; display: flex; align-items: center; gap: 6px; }
.feature .tile { box-shadow: 0 8px 24px rgba(0,0,0,.25), inset 0 0 0 1px rgba(255,255,255,.35); }
.feature p { opacity: .95; max-width: 34ch; }
.feature .chip-w { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.2); font-size: 12px; font-weight: 600; backdrop-filter: blur(6px); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 20px; color: var(--colorNeutralForeground3); font-size: 13px; }
.hero[hidden] + .stats { margin-top: 0; }
.empty .i-48 { width: 48px; height: 48px; }
.stats b { color: var(--colorNeutralForeground1); font-weight: 600; }
.toolbar { position: sticky; top: 60px; z-index: 4; display: flex; flex-direction: column; gap: 12px; padding: 14px 0; background: rgba(250,250,250,.92); backdrop-filter: blur(20px); }
.cats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 16px; }
.app { position: relative; display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: var(--borderRadius2XLarge); background: linear-gradient(180deg, var(--tint), var(--colorNeutralBackground1) 62%); box-shadow: var(--shadow4); border: 1px solid transparent; cursor: pointer; text-align: left; transition: box-shadow var(--durationNormal), transform var(--durationNormal) var(--curveDecelerateMid); }
.app:hover { box-shadow: var(--shadow16); transform: translateY(-2px); }
.app[aria-expanded=true] { border-color: var(--c1); box-shadow: var(--shadow16); }
.app[aria-expanded=true]::after { content: ""; position: absolute; left: 50%; bottom: -17px; width: 16px; height: 16px; background: var(--colorNeutralBackground1); transform: translateX(-50%) rotate(45deg); border-radius: 3px; box-shadow: -1px -1px 0 rgba(0,0,0,.04); z-index: 2; }
.app .name { font: 600 16px/22px var(--fontFamilyBase); }
.app .meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--colorNeutralForeground3); margin-top: auto; }
.app .meta .i { width: 14px; height: 14px; }
.app .cat { font-size: 12px; color: var(--ink); font-weight: 600; }
.app .corner { position: absolute; top: 14px; right: 14px; }
.detail { grid-column: 1 / -1; display: grid; grid-template-columns: 300px 1fr; border-radius: var(--borderRadius3XLarge); background: var(--colorNeutralBackground1); box-shadow: var(--shadow16); overflow: hidden; animation: grow var(--durationGentle) var(--curveDecelerateMid); }
@keyframes grow { from { opacity: 0; transform: translateY(-6px); } }
.detail aside { padding: 28px; background: linear-gradient(170deg, var(--tint), var(--colorNeutralBackground1) 70%); border-right: 1px solid var(--colorNeutralStroke3); display: flex; flex-direction: column; gap: 16px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 13px; }
.facts dt { color: var(--colorNeutralForeground3); }
.facts dd { margin: 0; }
.detail .work { padding: 28px 32px; display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.step-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.step-n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; background: var(--colorBrandBackground); }
.bundles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.bundle { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 14px 14px 12px; border-radius: var(--borderRadiusXLarge); border: 1px solid var(--colorNeutralStroke2); background: var(--colorNeutralBackground1); cursor: pointer; transition: border-color var(--durationFast), box-shadow var(--durationFast); }
.bundle:hover { border-color: var(--colorNeutralStroke1); box-shadow: var(--shadow4); }
.bundle:has(input:checked) { border: 2px solid var(--colorBrandBackground); padding: 13px 13px 11px; background: var(--colorBrandBackground2); }
.bundle:has(input:disabled) { cursor: not-allowed; background: var(--colorNeutralBackground3); }
.bundle input { position: absolute; top: 14px; right: 14px; }
.bundle .au { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; flex: none; }
.bundle .stat { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--colorNeutralForeground3); }
.bundle .stat span { display: inline-flex; align-items: center; gap: 3px; }
.bundle .stat .i { width: 13px; height: 13px; }
.patches { border: 1px solid var(--colorNeutralStroke2); border-radius: var(--borderRadiusXLarge); overflow: hidden; }
.patches-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; background: var(--colorNeutralBackground2); border-bottom: 1px solid var(--colorNeutralStroke2); }
.patch { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-bottom: 1px solid var(--colorNeutralStroke3); }
.patch:last-child { border-bottom: 0; }
.patch .pn { font-weight: 600; }
.patch .pd { font-size: 12px; line-height: 16px; color: var(--colorNeutralForeground3); }
.patch.changed { background: linear-gradient(90deg, var(--colorBrandBackground2), transparent 40%); }
.patch-list { max-height: 360px; overflow: auto; }
.src-box { display: grid; gap: 12px; }
.enable-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 20px; border-radius: var(--borderRadiusXLarge); background: var(--colorNeutralBackground3); }
.empty { display: grid; justify-items: center; gap: 12px; padding: 48px 24px; text-align: center; }
.src-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--colorNeutralStroke3); flex-wrap: wrap; }
.src-row:last-child { border-bottom: 0; }
@media (max-width: 1100px) { .hero .feature { flex-basis: 46%; } .hero .feature:first-child { flex-basis: 70%; } }
@media (max-width: 900px) {
  .hero .feature, .hero .feature:first-child { flex-basis: 86%; }
  .gallery { grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 12px; }
  .app { padding: 14px; } .app .tile { --s: 48px; }
  .detail { grid-template-columns: 1fr; } .detail aside { border-right: 0; border-bottom: 1px solid var(--colorNeutralStroke3); padding: 20px; }
  .detail .work { padding: 20px 16px; }
  .enable-bar .grow { flex-basis: 100%; }
}
</style>
<script type="module" src="/static/index.js"></script></head><body><a class="skip" href="#main">Skip to content</a>
<div class="shell"><aside class="side" aria-label="Primary"></aside>
<div class="main"><header class="header">
<button class="icon-btn menu-btn" type="button" data-nav-toggle aria-label="Open navigation" title="Open navigation"><svg class="i" aria-hidden="true"><use href="#i-menu"/></svg></button>
<h1 class="subtitle1 hide-m">Marketplace</h1><div class="grow hide-m"></div>
<label class="input search"><svg class="i i-16" aria-hidden="true"><use href="#i-search"/></svg><span class="sr-only">Search apps</span><input id="q" type="search" placeholder="Search apps or packages" autocomplete="off"></label>
<button class="btn" id="refresh" type="button" aria-label="Refresh catalog" title="Refresh catalog"><svg class="i" aria-hidden="true"><use href="#i-sync"/></svg><span class="hide-m">Refresh catalog</span></button>
<button class="btn" id="add-source" type="button" aria-label="Add custom source" title="Add custom source"><svg class="i" aria-hidden="true"><use href="#i-github"/></svg><span class="hide-m">Add custom source</span></button>
</header>
<main id="main" class="content">
<div id="notice" class="stack-sm" role="status"></div>
<section class="hero" id="hero" aria-label="Featured apps" hidden></section>
<div class="stats" id="stats" role="status"></div>
<div class="toolbar"><div class="row" style="gap:12px">
<div class="cats grow" id="cats" role="group" aria-label="Category"></div>
<label class="select"><span class="sr-only">Origin</span><select class="dropdown" id="origin"><option value="">All origins</option><option value="official">Official catalog</option><option value="builtin">Built-in</option><option value="custom">Custom</option></select></label>
<label class="select"><span class="sr-only">Sort</span><select class="dropdown" id="sort"><option value="bundles">Most bundles</option><option value="stars">Most stars</option><option value="updated">Recently updated</option><option value="name">Name A–Z</option></select></label>
</div></div>
<section class="gallery" id="gallery" aria-label="Apps"><section class="detail" id="detail" hidden></section></section>
<div id="empty" class="card empty" hidden></div>
<p class="caption" id="count" style="margin-top:24px;text-align:center"></p>
<div id="more" aria-hidden="true"></div>
<section class="section" id="sources" aria-labelledby="src-h" hidden><div class="section-head"><h2 class="subtitle1" id="src-h">Custom sources</h2></div><div class="card card-pad" id="source-list"></div></section>
</main></div></div>
<dialog id="dlg-custom" aria-labelledby="dc-t"><form method="dialog">
<h2 class="subtitle1" id="dc-t">Add a custom source</h2>
<p class="subtle-text" style="margin:6px 0 20px">A GitHub repository you trust. It appears in Marketplace next to the catalog with a <span class="origin custom">Custom</span> label.</p>
<div style="display:grid;gap:16px">
<div class="field"><label for="c-url">GitHub repository URL</label><span class="input"><svg class="i i-16" aria-hidden="true"><use href="#i-github"/></svg><input id="c-url" required placeholder="github.com/owner/repo" autocomplete="off"></span></div>
<fieldset style="border:0;padding:0;margin:0;display:grid;gap:8px"><legend class="label" style="margin-bottom:8px">Engine</legend>
<label class="row"><input type="radio" name="eng" value="morphe" checked>Morphe patches</label>
<label class="row"><input type="radio" name="eng" value="lspatch">Xposed module, packaged with LSPatch</label>
<label class="row"><input type="radio" name="eng" value="npatch">Xposed module, packaged with NPatch</label></fieldset>
<div id="c-mod" style="display:grid;gap:16px" hidden>
<div class="field"><label for="c-regex">Release asset regex</label><span class="input"><input id="c-regex" class="mono" placeholder="\.apk$" autocomplete="off"></span></div>
<div class="field"><label for="c-pkgs">Target packages</label><span class="input"><input id="c-pkgs" class="mono" placeholder="com.example.app, com.example.other" autocomplete="off"></span><div class="hint">Comma separated. The module is offered for these apps.</div></div></div>
</div>
<div class="dlg-actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Add source</button></div></form></dialog>
<dialog id="dlg-del" aria-labelledby="dd-t"><form method="dialog">
<h2 class="subtitle1" id="dd-t">Delete custom source</h2><p class="subtle-text" style="margin-top:6px" id="dd-msg"></p>
<div class="dlg-actions"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="ok">Delete</button></div></form></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg><span></span></div>
</body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Relume</title><link rel="stylesheet" href="/static/app.css"><link rel="manifest" href="/static/manifest.webmanifest"><meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff"><meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b"><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="icon" href="/static/icon-192.png" type="image/png" sizes="192x192"><link rel="apple-touch-icon" href="/static/icon-192.png">
<style>.auth{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:radial-gradient(1000px 420px at 50% -10%,hsl(var(--accent)/.14),transparent)}</style>
<script>document.documentElement.dataset.theme=localStorage.getItem('relume-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')</script>
<script type="module" src="/static/login.js"></script></head><body>
<main class="auth"><div style="width:100%;max-width:380px" class="stack">
<div class="row between"><div class="brand" style="padding:0"><img class="logo" src="/static/favicon.svg" alt="" width="28" height="28">Relume</div><button class="btn btn-ghost btn-icon" type="button" data-theme-toggle aria-label="Toggle light/dark theme" title="Toggle light/dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
<form class="card" id="f">
<div class="card-h" style="padding-top:1.5rem"><h1 style="font-size:1.25rem" id="title">Sign in</h1><p class="muted sm" id="sub">Single admin account for this build server.</p></div>
<div class="card-c stack">
<div class="field"><label class="lbl" for="u">Username</label><input class="input" id="u" autocomplete="username" required autofocus maxlength="64" pattern="[A-Za-z0-9._\-]+" aria-describedby="err"></div>
<div class="field"><label class="lbl" for="p">Password</label><div style="position:relative"><input class="input" id="p" type="password" autocomplete="current-password" required style="padding-right:4.5rem" aria-describedby="err ph"><button type="button" class="btn btn-ghost btn-sm" id="pwt" aria-controls="p" aria-pressed="false" style="position:absolute;right:2px;top:2px;height:calc(100% - 4px)">Show</button></div><p class="hint" id="ph" hidden>At least 10 characters. Username: letters, digits, <code>. _ -</code>.</p></div>
<div class="field" id="cf" hidden><label class="lbl" for="p2">Confirm password</label><input class="input" id="p2" type="password" autocomplete="new-password" aria-describedby="err"></div>
<div class="alert err" role="alert" id="err" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span></span></div>
<label class="row sm" style="flex-wrap:nowrap"><input type="checkbox" class="cb" id="remember" checked> Keep me signed in on this device (30 days)</label>
<button class="btn btn-accent" id="go" style="width:100%;height:2.5rem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Sign in</button>
</div></form>
<dl class="xs muted mono" style="display:grid;grid-template-columns:auto 1fr;gap:.25rem 1rem;margin:0;justify-self:center" id="srv" aria-label="Server"></dl><p class="xs muted" style="text-align:center;margin:0">Relume v1.0</p></div></main>
<div id="toast" class="toast" role="status" aria-live="polite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg><span></span></div>
</body></html>

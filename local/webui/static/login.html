<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Relume</title><link rel="stylesheet" href="/static/app.css"><link rel="manifest" href="/static/manifest.webmanifest"><meta name="theme-color" content="#ffffff"><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="icon" href="/static/icon-192.png" type="image/png" sizes="192x192"><link rel="apple-touch-icon" href="/static/icon-192.png">
<style>.auth{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:radial-gradient(1000px 420px at 50% -10%,color-mix(in srgb,var(--colorBrandForeground1) 14%,transparent),transparent)}</style>
<script type="module" src="/static/login.js"></script></head><body>
<main class="auth"><div style="width:100%;max-width:380px" class="stack">
<div class="row between"><div class="brand" style="padding:0"><img class="logo" src="/static/favicon.svg" alt="" width="28" height="28">Relume</div></div>
<form class="card" id="f">
<div class="card-head" style="padding-top:1.5rem"><h1 style="font-size:1.25rem;white-space:nowrap" id="title">Sign in</h1><p class="muted sm" id="sub">Single admin account for this build server.</p></div>
<div class="card-pad stack">
<div class="field"><label class="label" for="u">Username</label><input class="input" id="u" autocomplete="username" required autofocus maxlength="64" pattern="[A-Za-z0-9._\-]+" aria-describedby="err"></div>
<div class="field"><label class="label" for="p">Password</label><span class="input"><input id="p" type="password" autocomplete="current-password" required aria-describedby="err ph"><button type="button" class="btn subtle small" id="pwt" aria-controls="p" aria-pressed="false">Show</button></span><p class="hint" id="ph" hidden>At least 10 characters. Username: letters, digits, <code>. _ -</code>.</p></div>
<div class="field" id="cf" hidden><label class="label" for="p2">Confirm password</label><input class="input" id="p2" type="password" autocomplete="new-password" aria-describedby="err"></div>
<div class="msgbar err" role="alert" id="err" hidden><svg class="i" aria-hidden="true"><use href="#i-warning"/></svg><span></span></div>
<label class="row sm" style="flex-wrap:nowrap"><input type="checkbox" id="remember" checked> Keep me signed in on this device (30 days)</label>
<button class="btn primary large" id="go"><svg class="i" aria-hidden="true"><use href="#i-lock"/></svg>Sign in</button>
</div></form>
<dl class="xs muted mono" style="display:grid;grid-template-columns:auto 1fr;gap:.25rem 1rem;margin:0;justify-self:center" id="srv" aria-label="Server"></dl><p class="xs muted" style="text-align:center;margin:0">Relume v1.0</p></div></main>
<div id="toast" class="toast" role="status" aria-live="polite"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg><span></span></div>
</body></html>
